<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WebCAD - Legacy of OpenSCAD</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #1e1e1e;
            color: #fff;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #editor-container {
            width: 45%;
            height: 100%;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            overflow: auto;
            font-size: 14px;
        }

        #viewport-container {
            width: 55%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 10;
        }

        .cm-editor {
            height: 100%;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm",
                "lz-string": "https://esm.sh/lz-string@1.5.0"
            }
        }
    </script>
    <script defer type="module" src="main.js"></script>
</head>

<body>
    <div id="app-container">
        <div id="editor-container">
            <div id="editor"></div>
        </div>
        <div id="viewport-container">
            <div id="loading">Booting OpenSCAD Kernel...</div>
            <div id="canvas-container"></div>
        </div>
    </div>
</body>

</html>
